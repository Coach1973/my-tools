 const title=h('div',{class:'sec-title',onclick:()=>{trashOpen=!trashOpen;sec.classList.toggle('collapsed',!trashOpen)}},
  h('span',{class:'arrow'},'▼'),'🗑 已刪除',h('span',{class:'count'},n+'項'));
 const foot=n?h('div',{class:'trashfoot'},h('div',{class:'desc'},'刪除的網址會先放在這裡，不會直接消失；按「↩ 復原」，或用上方「☑️ 批量搬移模式」勾選後移回想要的分類。確定不要了再永久刪除。'),h('button',{class:'btn danger',onclick:emptyTrash},'🗑 永久清空已刪除')):'';
 const sec=h('section',{class:'sec'+(trashOpen?'':' collapsed'),id:'trashSec'},title,grid,foot);
 const box=$('#trash');box.textContent='';box.append(sec)}
function render(){
 $('#sub').textContent='共 '+countAll()+' 個網址，分 '+state.sections.length+' 類。點名稱開新分頁；點分類標題可收合；上方可搜尋。';
 document.body.classList.toggle('editing',edit);document.body.classList.toggle('bulking',bulk);$('#bulkBtn').textContent=bulk?'✅ 結束批量搬移':'☑️ 批量搬移模式';$('#bulkBtn').classList.toggle('on',bulk);fillBulk();$('#editBtn').textContent=edit?'✅ 完成編輯':'✏️ 編輯排版';$('#editBtn').classList.toggle('on',edit);$('#addSec').classList.toggle('hide',!edit);
 const wrap=$('#wrap');wrap.textContent='';
 state.sections.forEach((s,si)=>{
  const grid=h('div',{class:'grid'});grid.dataset.si=si;
  s.items.forEach((it,ii)=>grid.append(itemEl(it,si,ii)));
  const tools=h('div',{class:'sec-tools'},
   h('button',{class:'btn',onclick:e=>{e.stopPropagation();moveSec(si,-1)}},'▲ 上移'),
   h('button',{class:'btn',onclick:e=>{e.stopPropagation();moveSec(si,1)}},'▼ 下移'),
   h('button',{class:'btn',onclick:e=>{e.stopPropagation();secForm(si)}},'✎ 改名稱'),
   h('button',{class:'btn danger',onclick:e=>{e.stopPropagation();delSec(si)}},'🗑 刪除分類'));
  const title=h('div',{class:'sec-title',onclick:()=>{s.collapsed=!s.collapsed;sec.classList.toggle('collapsed',s.collapsed);persist()}},
   h('span',{class:'arrow'},'▼'),(s.icon?s.icon+' ':'')+s.title,h('span',{class:'count'},s.items.length+'項'),h('button',{class:'btn sec-sel',onclick:e=>{e.stopPropagation();selSec(si)}},'全選這一類'),tools);
  const sec=h('section',{class:'sec'+(s.collapsed?' collapsed':'')},title,grid,
   h('div',{class:'addrow'},h('button',{class:'btn',onclick:()=>itemForm(si,-1)},'＋新增網址到這一類')));
  wrap.append(sec)});
 renderTrash();applySearch()}
function itemEl(it,si,ii){
 const box=h('span',{class:'bulk-checkbox'},sel.has(it)?'☑':'☐');
 const inner=[h('div',{class:'handle',title:'拖曳搬動'},'⠿'),box,h('div',{class:'num'},String(ii+1)),
  h('div',{class:'mid'},h('div',{class:'name'},it.name),h('div',{class:'url'},host(it.url)),it.desc?h('div',{class:'desc'},it.desc):''),
  it.tag?h('div',{class:'badge'},it.tag):'',h('button',{class:'btn more',onclick:e=>{e.preventDefault();e.stopPropagation();itemForm(si,ii)}},'⋯')];
 const a=h('a',{class:'item',href:it.url,target:'_blank',rel:'noopener'},inner);
 a.dataset.s=(it.name+' '+it.url+' '+it.desc+' '+it.tag).toLowerCase();a.dataset.si=si;a.dataset.ii=ii;
 if(sel.has(it))a.classList.add('selected');
 a.addEventListener('click',e=>{if(edit||bulk)e.preventDefault();if(bulk&&!e.target.closest('.handle,.more')){sel.has(it)?sel.delete(it):sel.add(it);a.classList.toggle('selected',sel.has(it));box.textContent=sel.has(it)?'☑':'☐';$('#bulkCnt').textContent=sel.size}});
 const hd=a.querySelector('.handle');hd.addEventListener('pointerdown',e=>dragStart(e,a,si,ii));
 return a}
function applySearch(){const k=$('#q').value.trim().toLowerCase();
 document.querySelectorAll('.item').forEach(i=>i.classList.toggle('hide',!!k&&!i.dataset.s.includes(k)));
 document.querySelectorAll('.sec').forEach(s=>{const v=s.querySelectorAll('.item:not(.hide)').length;s.classList.toggle('hide',!!k&&!v&&!edit);if(k&&v)s.classList.remove('collapsed')})}
// ---- 拖曳（電腦滑鼠、手機手指都用抓把手）----
let drag=null;
function dragStart(e,el,si,ii){e.preventDefault();e.stopPropagation();try{el.setPointerCapture(e.pointerId)}catch(_){}drag={el,si,ii};el.classList.add('dragging');
 const mv=ev=>{clearMarks();const t=document.elementFromPoint(ev.clientX,ev.clientY);if(!t)return;const it=t.closest('.item'),gr=t.closest('.grid');
  if(it&&it!==el)it.classList.add('drop-before');else if(gr&&!it)gr.classList.add('drop-end')};
 const up=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
  el.classList.remove('dragging');const t=document.elementFromPoint(ev.clientX,ev.clientY);clearMarks();
  if(t){const it=t.closest('.item'),gr=t.closest('.grid');let ts=null,ti=null;
   if(it&&it!==el){ts=+it.dataset.si;ti=+it.dataset.ii}else if(gr&&!it){ts=+gr.dataset.si;ti=state.sections[ts].items.length}
   if(ts!==null)moveItem(drag.si,drag.ii,ts,ti)}drag=null};
 el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
function clearMarks(){document.querySelectorAll('.drop-before,.drop-end').forEach(x=>x.classList.remove('drop-before','drop-end'))}
function moveItem(fs,fi,ts,ti){const it=state.sections[fs].items.splice(fi,1)[0];if(fs===ts&&ti>fi)ti--;state.sections[ts].items.splice(ti,0,it);render();persist()}
function moveSec(si,d){const j=si+d;if(j<0||j>=state.sections.length)return;const a=state.sections;[a[si],a[j]]=[a[j],a[si]];render();persist()}
function delSec(si){const s=state.sections[si];
 if(state.sections.length<=1){alert('至少要留一個分類。');return}
 if(!confirm('確定要刪除整個「'+s.title+'」分類嗎？裡面的項目會先移到「已刪除」，分類本身會消失。'))return;
 const n=s.items.length;[...s.items].reverse().forEach(i=>toTrash(i,s.id,s.title));
 state.sections.splice(si,1);sel.clear();render();persist('已刪除「'+s.title+'」分類，'+n+' 個項目已移到「已刪除」')}
// ---- 批量搬移（跟「大樹作品一覽」同一套操作：勾選 → 選分類 → 搬移）----
function fillBulk(){const o=$('#bulkTo'),v=o.value;o.textContent='';state.sections.forEach((s,i)=>o.append(h('option',{value:String(i)},(s.icon?s.icon+' ':'')+s.title)));o.append(h('option',{value:'trash'},'🗑 已刪除'));if(v==='trash'||(v&&+v<state.sections.length))o.value=v;$('#bulkCnt').textContent=sel.size}
function selSec(si){const its=state.sections[si].items,all=its.length&&its.every(i=>sel.has(i));its.forEach(i=>all?sel.delete(i):sel.add(i));render()}
function bulkMove(){if(!sel.size){setStatus('請先勾選要搬移的項目',true);return}
 const to=$('#bulkTo').value;
 if(to==='trash'){let n=0;state.sections.forEach(s=>{s.items=s.items.filter(i=>{if(sel.has(i)){toTrash(i,s.id,s.title);n++;return false}return true})});
  sel.clear();render();if(!n){setStatus('勾選的網址本來就在「已刪除」');return}persist('已把 '+n+' 個網址移到「已刪除」，可以復原');return}
 const ti=+to,t=state.sections[ti],moved=[];
 state.sections.forEach((s,si)=>{if(si!==ti)s.items=s.items.filter(i=>{if(sel.has(i)){moved.push(i);return false}return true})});
 const back=state.trash.filter(x=>sel.has(x));back.forEach(x=>moved.push({name:x.name,url:x.url,desc:x.desc||'',tag:x.tag||''})); // 已刪除裡勾選的＝搬回這一類
 state.trash=state.trash.filter(x=>!sel.has(x));state.removed=(state.removed||[]).filter(u=>!back.some(x=>x.url===u));
 t.items.push(...moved);sel.clear();render();
 if(!moved.length){setStatus('勾選的網址本來就在「'+t.title+'」');return}persist()}
function bulkDel(){if(!sel.size){setStatus('請先勾選要刪除的項目',true);return}
 const inTrash=state.trash.filter(x=>sel.has(x));
 if(inTrash.length&&!confirm('勾選的項目裡有 '+inTrash.length+' 個已經在「已刪除」，會被永久刪除，這個動作無法復原。確定嗎？'))return;
 let n=0;state.sections.forEach(s=>{s.items=s.items.filter(i=>{if(sel.has(i)){toTrash(i,s.id,s.title);n++;return false}return true})});
 inTrash.forEach(x=>purgeUrl(x.url));sel.clear();render();
 persist((n?'已把 '+n+' 個網址移到「已刪除」，可以復原':'')+(n&&inTrash.length?'；':'')+(inTrash.length?'永久刪除 '+inTrash.length+' 個':''))}
// ---- 表單 ----
function modal(title,fields,buttons){const mask=h('div',{class:'mask'});const box=h('div',{class:'modal'},h('h3',{},title));const inputs={};
 fields.forEach(f=>{box.append(h('label',{},f.label));let el;if(f.options){el=h('select',{},f.options.map(o=>{const op=h('option',{value:o.v},o.t);if(o.v===f.value)op.selected=true;return op}))}else{el=h('input',{value:f.value||'',placeholder:f.ph||''})}inputs[f.key]=el;box.append(el)});
 const close=()=>mask.remove();const acts=h('div',{class:'acts'});
 buttons.forEach(b=>acts.append(h('button',{class:'btn '+(b.cls||''),onclick:()=>{const v={};for(const k in inputs)v[k]=inputs[k].value.trim();if(b.fn(v)!==false)close()}},b.t)));
 acts.append(h('button',{class:'btn',onclick:close},'取消'));box.append(acts);mask.append(box);mask.addEventListener('pointerdown',e=>{if(e.target===mask)close()});document.body.append(mask);
 const first=box.querySelector('input');if(first)first.focus()}
function itemForm(si,ii){const adding=ii<0;const it=adding?{name:'',url:'',desc:'',tag:''}:state.sections[si].items[ii];
 modal(adding?'新增網址':'編輯網址',[
  {key:'name',label:'名稱',value:it.name},{key:'url',label:'網址（https://開頭）',value:it.url,ph:'https://'},{key:'desc',label:'說明（選填）',value:it.desc},{key:'tag',label:'標籤（選填，例如 查詢）',value:it.tag},
  {key:'sec',label:'放在哪一類',value:String(si),options:state.sections.map((s,i)=>({v:String(i),t:(s.icon?s.icon+' ':'')+s.title}))}],
  [{t:'💾 儲存',fn:v=>{if(!/^https?:\/\//.test(v.url)){alert('網址要用 https:// 開頭');return false}
    const n={name:v.name||v.url,url:v.url,desc:v.desc,tag:v.tag};const ts=+v.sec;
    if(adding){state.sections[ts].items.push(n)}else{const old=state.sections[si].items;if(ts===si)old[ii]=n;else{old.splice(ii,1);state.sections[ts].items.push(n)}}
    state.removed=(state.removed||[]).filter(u=>u!==n.url);state.trash=(state.trash||[]).filter(t=>t.url!==n.url);state.purged=(state.purged||[]).filter(u=>u!==n.url);render();persist()}},
   ...(adding?[]:[{t:'▲ 上移',fn:()=>{if(ii>0){moveItem(si,ii,si,ii-1)}}},{t:'▼ 下移',fn:()=>{if(ii<state.sections[si].items.length-1){moveItem(si,ii,si,ii+2)}}},
    {t:'🗑 刪除',cls:'danger',fn:()=>{toTrash(it,state.sections[si].id,state.sections[si].title);state.sections[si].items.splice(ii,1);render();persist('已把「'+it.name+'」移到「已刪除」，可以復原')}}])])}
function secForm(si){const adding=si<0;const s=adding?{icon:'📁',title:''}:state.sections[si];
 modal(adding?'新增分類':'改分類名稱',[{key:'icon',label:'符號（一個表情符號，選填）',value:s.icon},{key:'title',label:'分類名稱',value:s.title}],
  [{t:'💾 儲存',fn:v=>{if(!v.title){alert('請輸入分類名稱');return false}
    if(adding)state.sections.push({id:'s'+Date.now().toString(36),icon:v.icon,title:v.title,collapsed:false,items:[]});else{s.icon=v.icon;s.title=v.title}render();persist()}}])}
// ---- 儲存與載入 ----
function setStatus(t,err){const s=$('#status');s.textContent=t;s.classList.toggle('err',!!err)}
function persist(msg){try{localStorage.setItem(CACHE,JSON.stringify(state));localStorage.setItem(DIRTY,'1')}catch(e){}
 pendingMsg=msg||'';setStatus((pendingMsg?pendingMsg+'｜':'')+'儲存中…');clearTimeout(saveTimer);saveTimer=setTimeout(push,500)}
function push(){fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:state}),keepalive:true})
 .then(r=>r.ok?(setStatus((pendingMsg?pendingMsg+'｜':'')+'✓ 已儲存，所有裝置都會看到'),localStorage.removeItem(DIRTY)):Promise.reject(r.status)).catch(()=>setStatus('⚠ 儲存失敗，稍後再試（已先存在這台裝置）',true))}
$('#editBtn').onclick=()=>{edit=!edit;render()};$('#bulkBtn').onclick=()=>{bulk=!bulk;if(!bulk)sel.clear();render()};$('#bulkMove').onclick=bulkMove;$('#bulkDel').onclick=bulkDel;$('#trashBtn').onclick=()=>{trashOpen=true;renderTrash();applySearch();$('#trashSec').scrollIntoView({behavior:'smooth',block:'start'})};$('#addSec').onclick=()=>secForm(-1);$('#q').addEventListener('input',applySearch);
addEventListener('pagehide',()=>{if(saveTimer){clearTimeout(saveTimer);push()}});
let cached=null;try{cached=JSON.parse(localStorage.getItem(CACHE)||'null')}catch(e){}
state=merge(cached&&cached.sections?cached:defaults());render();
fetch(API).then(r=>r.json()).then(j=>{if(localStorage.getItem(DIRTY)){push();return} // 這台有還沒送出去的修改，先送出，不被伺服器舊版蓋掉
 if(j&&j.data&&j.data.sections){sel.clear();state=merge(j.data);try{localStorage.setItem(CACHE,JSON.stringify(state))}catch(e){}render()}}).catch(()=>{});
</script></body></html>
