<style>
  :root { --gold:#c8a96e; --dark:#0a0a0a; --dark2:#141414; --line:rgba(200,169,110,.3); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Noto Sans TC', sans-serif; font-size:20px; background:var(--dark); color:#fff; padding:36px 20px 100px; }
  .wrap { max-width:1500px; margin:0 auto; column-count:2; column-gap:48px; }
  .section-block { break-inside:avoid; -webkit-column-break-inside:avoid; display:inline-block; width:100%; }
  @media (max-width:900px){
    .wrap { column-count:1; }
  }
  h1 { font-size:32px; font-weight:900; margin-bottom:6px; }

  .sub { color:rgba(255,255,255,.5); font-size:20px; margin-bottom:18px; }
  .toolbar { display:flex; gap:12px; align-items:center; margin-bottom:28px; flex-wrap:wrap; }
  .btn-copy {
    background:rgba(200,169,110,.12); border:1px solid var(--gold); color:var(--gold);
    font-family:inherit; font-size:20px; font-weight:900; padding:10px 18px; border-radius:10px;
    cursor:pointer; transition:.2s;
  }
  .btn-copy:hover { background:rgba(200,169,110,.25); }
  .toast {
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);

    padding:14px 28px; border-radius:12px; opacity:0; pointer-events:none;
    transition:.25s; z-index:999; box-shadow:0 8px 24px rgba(0,0,0,.4);
    max-width:calc(100vw - 32px); width:max-content;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .section-title {
    display:flex; align-items:center; gap:12px; margin:40px 0 16px;
    font-size:24px; font-weight:900; color:var(--gold);
  }
  .section-title .count { font-size:20px; color:rgba(255,255,255,.4); font-weight:700; white-space:nowrap; }
  .section-title::after { content:''; flex:1; height:1px; background:var(--line); }
  .section-drag-handle {
    flex-shrink:0; width:20px; text-align:center; cursor:grab; user-select:none;
    color:rgba(255,255,255,.3); font-size:20px; letter-spacing:-2px; transition:.2s; touch-action:none;
  }
  .section-drag-handle:hover { color:var(--gold); }
  .section-drag-handle:active { cursor:grabbing; }
  .section-block.section-dragging { opacity:.4; border:1px dashed var(--gold); border-radius:12px; }
  .grid { display:flex; flex-direction:column; gap:8px; }
  .item {
    display:flex; align-items:center; gap:12px; color:#fff;
    background:var(--dark2); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px 10px 8px; transition:border-color .2s, background .2s;
  }
  .item:hover { border-color:var(--gold); background:#1a1a1a; }
  .item.dragging { opacity:.35; border-style:dashed; }
  .drag-handle {
    flex-shrink:0; width:28px; height:34px; display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,.3); cursor:grab; font-size:20px; letter-spacing:-2px; touch-action:none;
    border-radius:6px; transition:.2s;
  }
  .drag-handle:hover { color:var(--gold); background:rgba(200,169,110,.1); }
  .drag-handle:active { cursor:grabbing; }
  .num {
    flex-shrink:0; width:40px; height:40px; border-radius:8px; background:#1c1c1c;
    display:flex; align-items:center; justify-content:center; font-weight:900;
    font-size:20px; color:var(--gold); border:1px solid var(--line);
  }
  .name { font-weight:700; font-size:21px; flex:1; min-width:0; overflow-wrap:anywhere; color:#fff; text-decoration:none; }
  .name:hover { text-decoration:underline; }
  .url { font-size:20px; color:rgba(255,255,255,.35); font-variant-numeric:tabular-nums; max-width:40%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge {
    font-size:20px; font-weight:900; padding:3px 12px; border-radius:999px; flex-shrink:0;
  }
  .badge:empty { min-width:44px; min-height:34px; }
  .badge.star { background:rgba(200,169,110,.25); color:var(--gold); }
  .note { font-size:20px; color:rgba(255,255,255,.4); padding:10px 18px; }
  .title-text, .badge { cursor:text; }
  .title-text:focus, .badge:focus { outline:1px dashed var(--gold); border-radius:4px; }
  .toggle-arrow {
    cursor:pointer; flex-shrink:0; width:20px; text-align:center; user-select:none;
    color:rgba(255,255,255,.4); font-size:20px; transition:transform .2s, color .2s;
  }
  .toggle-arrow:hover { color:var(--gold); }
  .section-block.collapsed .toggle-arrow { transform:rotate(-90deg); }
  .section-block.collapsed .grid, .section-block.collapsed .note, .section-block.collapsed .btn-add-item { display:none; }
  .section-del {
    cursor:pointer; flex-shrink:0; font-size:20px; opacity:.35; transition:opacity .2s;
  }
  .section-del:hover { opacity:1; }
  .item-del {
    cursor:pointer; flex-shrink:0; color:rgba(255,255,255,.3); font-size:20px; font-weight:900;
    padding:0 2px; transition:color .2s;
  }
  .item-del:hover { color:#ff6b6b; }
  .hot-item-del {
    cursor:pointer; flex-shrink:0; color:rgba(255,255,255,.3); font-size:20px; font-weight:900;
    padding:0 2px; transition:color .2s;
  }
  .hot-item-del:hover { color:#ff6b6b; }
  .btn-add-item {
    display:block; width:100%; margin-top:6px; background:transparent; border:1px dashed var(--line);
    color:rgba(255,255,255,.4); border-radius:10px; padding:8px 14px; font-size:20px; font-weight:700;
    cursor:pointer; text-align:center; font-family:inherit; transition:.2s;
  }
  .btn-add-item:hover { border-color:var(--gold); color:var(--gold); background:rgba(200,169,110,.08); }
  .btn-add-section {
    background:transparent; border:1px dashed var(--gold); color:var(--gold);
    font-family:inherit; font-size:20px; font-weight:900; padding:10px 18px; border-radius:10px;
    cursor:pointer; transition:.2s;
  }
  .btn-add-section:hover { background:rgba(200,169,110,.15); }
  .bulk-checkbox { display:none; flex-shrink:0; width:22px; height:22px; cursor:pointer; accent-color:var(--gold); }
  .wrap.bulk-mode .bulk-checkbox { display:inline-block; }
  .item.selected { border-color:var(--gold); background:rgba(200,169,110,.1); }
  .edit-name { cursor:pointer; flex-shrink:0; opacity:.3; font-size:20px; transition:opacity .2s; }
  .edit-name:hover { opacity:1; }
  .bulk-bar {
    position:fixed; bottom:0; left:0; right:0; background:#151107; border-top:2px solid var(--gold);
    padding:14px 20px; display:none; align-items:center; gap:12px; flex-wrap:wrap; z-index:1000;
    box-shadow:0 -4px 16px rgba(0,0,0,.4); font-size:20px;
  }
  .bulk-bar.show { display:flex; }
  .bulk-bar .count { color:var(--gold); font-weight:900; }
  .bulk-bar select {
    background:#1c1c1c; color:#fff; border:1px solid var(--line); border-radius:8px;
    padding:8px 12px; font-family:inherit; font-size:20px; max-width:100%;
  }
  @media (max-width:520px){
    body { padding-left:16px; padding-right:16px; }
    .url { display:none; }
    .name { font-size:20px; }
    .item, .hot-item { gap:8px; padding-right:10px; }
    .section-title { gap:8px; }
  }
  .hot-ranking-block { break-inside:avoid; -webkit-column-break-inside:avoid; display:inline-block; width:100%; }
  .hot-ranking-title { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 16px; font-size:24px; font-weight:900; color:var(--gold); }
  .hot-ranking-sub { font-size:20px; color:rgba(255,255,255,.4); font-weight:700; }
  .hot-grid { display:flex; flex-direction:column; gap:8px; }
  .hot-item { display:flex; align-items:center; gap:12px; color:#fff; background:var(--dark2); border:1px solid var(--gold); border-radius:10px; padding:10px 14px; }
  .hot-item:hover { background:#1a1a1a; }
  .hot-rank { flex-shrink:0; width:36px; height:36px; border-radius:8px; background:rgba(200,169,110,.2); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:20px; color:var(--gold); }
  .hot-clicks { font-size:20px; color:rgba(255,255,255,.4); flex-shrink:0; white-space:nowrap; }
  .hot-empty { font-size:20px; color:rgba(255,255,255,.35); padding:6px 4px; }
</style>
</head>
<body>
<div class="wrap">
<h1>大樹的常用查詢網站<span>｜個人專用</span></h1>
<p class="sub">拖動左側 ⠿ 手把可調整順序，也可以拖到別的分類；點大項標題文字或右側標籤文字可直接修改，離開文字框自動記住；點名稱旁的✏️可改顯示名稱；編號跟項目數會自動更新；點名稱直接開啟連結。</p>
<div class="toolbar">
<button class="btn-copy" id="btnCopy">📋 複製目前排序（貼給AI固化進正式檔案）</button>
<button class="btn-add-section" id="btnAddSection">➕ 新增分類</button>
<button class="btn-add-section" id="btnBulkMode">☑️ 批量搬移模式</button>
</div>
<div class="hot-ranking-block" id="hotRankingBlock">
<div class="hot-ranking-title">🔥 熱門排行 <span class="hot-ranking-sub">依點擊次數即時排名，不影響原本分類位置</span></div>
<div class="hot-grid" id="hotRankingGrid"><div class="hot-empty">還沒有點擊紀錄，累積使用後這裡會自動排出你最常點的項目。</div></div>
</div>
<div class="section-block" id="recycleBinBlock">
<div class="section-title" data-section="recentlydeleted"><span class="toggle-arrow" title="收合/展開">▼</span><span class="idx">🗑</span><span class="title-text" contenteditable="false" spellcheck="false">最近刪除</span> <span class="count">0項</span></div>
<div class="grid" data-section="recentlydeleted"></div>
<p class="note">刪除的項目會先放在這裡，不會直接消失；用上方「☑️批量搬移模式」勾選後可以移回想要的分類。確定不要了再按下面永久清空。</p>
<button class="btn-add-item" id="btnEmptyRecycleBin">🗑 永久清空最近刪除</button>
</div>
</div>
<div class="toast" id="toast"></div>
<div class="bulk-bar" id="bulkBar">
<span>已勾選 <span class="count" id="bulkCount">0</span> 個項目</span>
<select id="bulkTargetSelect"></select>
<button class="btn-add-section" id="btnBulkMove">搬移到這個分類</button>
</div>
<script>
(function(){

, {"name": "AI 改變世界．百人導師同行", "url": "https://mentor100.bymyway.com/", "desc": "mentor100 導師計畫", "tag": "官方"}, {"name": "AI 特助心法・一鍵注入", "url": "https://coach1973.github.io/ai-go/", "desc": "貼給任何 AI，30 秒進入特助狀態", "tag": "常用"}]}, {"id": "daily", "icon": "🗓️", "title": "我的日常查詢", "items": [{"name": "2026 全年度行事曆", "url": "https://tainan-calender.netlify.app/", "desc": "全年度行事曆", "tag": "查詢"}, {"name": "大樹教練｜可約時間", "url": "https://event.bymyway.com/schedule/t1qZLUh7D4RoewGA/", "desc": "別人預約我的時間表", "tag": "查詢"}, {"name": "大樹教練待辦事項", "url": "https://event.bymyway.com/todo", "desc": "特助主動提醒版", "tag": "查詢"}, {"name": "2026 企業 AI 導入與政府補助需求調查", "url": "https://docs.google.com/forms/d/e/1FAIpQLSdCIH8ffceaxzxoTEZhd4ZaJlPVLMw9unkoHtUm_HOyD6v43g/viewform", "desc": "Google 表單", "tag": "表單"}, {"name": "字級大小對照表", "url": "https://coach1973.github.io/coach888/font-scale.html", "desc": "大樹AI工具箱的字級參考", "tag": "工具"}, {"name": "大樹策展中心｜上傳網址", "url": "https://event.bymyway.com/curation/upload", "desc": "店家／品牌網站上傳，一條龍上架策展中心", "tag": "查詢"}, {"name": "榮樹下｜來賓卡", "url": "https://event.bymyway.com/rongtree/a/b99f99e2f2b0", "desc": "榮樹下來賓資料與 AI 來賓卡（專屬連結）", "tag": "查詢"}, {"name": "免費線上調音器・節拍器｜家緯家吉他坊", "url": "https://pickd.tw/guitar-tuner-metronome/", "desc": "吉他免安裝校音，手機也能用", "tag": "工具"}]}, {"id": "works", "icon": "🎨", "title": "大樹作品・策展頁", "items": [{"name": "大臺南商圈整合計劃・大台南策展中心", "url": "https://event.bymyway.com/tainan-shangquan/", "desc": "免費為店家建站、開通頻道", "tag": "策展"}, {"name": "全世界最優秀的團隊計畫", "url": "https://event.bymyway.com/curated/three-lacks/", "desc": "客戶、人才、伯樂", "tag": "策展"}, {"name": "為你轉身｜真 AI 線上團隊商業導師席", "url": "https://event.bymyway.com/curated/turnforyou/", "desc": "八位商業顧問師", "tag": "策展"}, {"name": "顧問師天團・人才軍火庫", "url": "https://event.bymyway.com/curated/skyteam/", "desc": "上百位專家人才與頂尖顧問師", "tag": "策展"}, {"name": "約瑟布｜生命農業與永續商業計畫", "url": "https://event.bymyway.com/curated/joseph-cloth/", "desc": "榮樹下客戶網站", "tag": "策展"}, {"name": "有薇力，新東區｜蔡筱薇競選總部成立大會", "url": "https://event.bymyway.com/curated/111-wei/", "desc": "11/1（日）09:00", "tag": "策展"}, {"name": "像瘋子的發明家｜黃國彰", "url": "https://event.bymyway.com/curated/inventor/", "desc": "能源專利發明人", "tag": "策展"}, {"name": "南應大校友互動記憶牆", "url": "https://event.bymyway.com/curated/tut-memory/", "desc": "TUT Alumni Memory Wall", "tag": "策展"}, {"name": "海餅乾俱樂部 20 週年", "url": "https://event.bymyway.com/seabiscuit20/#home", "desc": "Sea Biscuit Club 2007–2027", "tag": "策展"}, {"name": "教練與軍師：深夜的 32MB 封包攻防戰 第1話", "url": "https://www.tava-ai.com/chat/b72pvmh9x1/index.html", "desc": "TAVA 做的漫畫", "tag": "漫畫"}, {"name": "大樹的答案 ── 漫畫版", "url": "https://event.bymyway.com/curated/answer/", "desc": "日系漫畫版思想漫畫", "tag": "漫畫"}, {"name": "大樹教練｜企業成長條漫 EP01–EP05", "url": "https://event.bymyway.com/curated/answer2/", "desc": "全五話條漫", "tag": "漫畫"}]}];
  var CACHE_KEY = 'mytools_state_v1';
  var DIRTY_KEY = 'mytools_dirty_v1'; // 這台裝置有還沒送到伺服器的修改，載入時先送出，不被伺服器舊版蓋掉

  // ── 跨裝置同步：作品一覽是把好幾個 localStorage 欄位推到 /api/coach888/state；
  // 這裡整頁存成一份 {sections, removed, trash, trashCollapsed}，格式由伺服器 _mytools_clean 檢查。
  var SYNC_ENDPOINT = 'https://event.bymyway.com/api/mytools/state';
  var _syncTimer = null;
  var _syncDirty = false;
  var removedUrls = []; // 刪過的網址（含永久刪除）：原始清單 DEFAULTS 不會再把它們補回來

  // 畫面就是資料：從目前畫面上的分類、項目、最近刪除讀出要存的內容
  function buildState(){
    var sections = [], trash = [], live = {};
    document.querySelectorAll('.section-block').forEach(function(block){
      var title = block.querySelector('.section-title');
      var grid = block.querySelector('.grid');
      if (!title || !grid) return;
      var items = Array.prototype.map.call(grid.querySelectorAll('.item'), function(it){
        return { name: it.querySelector('.name').textContent.trim(), url: it.dataset.url, desc: it.dataset.desc || '',
                 tag: it.querySelector('.badge').textContent.trim(), from: it.dataset.from || null };
      });
      if (block.id === 'recycleBinBlock') { trash = items; return; }
      items.forEach(function(i){ live[i.url] = true; delete i.from; });
      sections.push({ id: title.dataset.section, icon: block.dataset.icon || '',
                      title: title.querySelector('.title-text').textContent.trim(),
                      collapsed: block.classList.contains('collapsed'), items: items });
    });
    trash.forEach(function(t){ if (removedUrls.indexOf(t.url) < 0) removedUrls.push(t.url); });
    removedUrls = removedUrls.filter(function(u){ return !live[u]; });
    return { sections: sections, removed: removedUrls.slice(), trash: trash,
             trashCollapsed: document.getElementById('recycleBinBlock').classList.contains('collapsed') };
  }
  function syncStateToServer(){
    _syncDirty = true;
    clearTimeout(_syncTimer);
    _syncTimer = setTimeout(function(){
      fetch(SYNC_ENDPOINT, {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({data: buildState()})
      }).then(function(r){
        _syncDirty = false;
        if (r.ok) { try { localStorage.removeItem(DIRTY_KEY); } catch(e){} toast('✅ 已同步（剛剛）'); }
        else toast('⚠️ 同步失敗，稍後會自動重試');
      }).catch(function(){ toast('⚠️ 同步失敗，稍後會自動重試'); });
    }, 400);
  }
  function saveState(){
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify(buildState()));
      localStorage.setItem(DIRTY_KEY, '1');
    } catch(e){}
    syncStateToServer();
  }
  // 作品一覽每種修改各存一個欄位；這裡整份一起存，名字留著方便跟作品一覽逐行對照
  var saveLayout = saveState, saveTitles = saveState, saveBadges = saveState, saveNames = saveState,
      saveCollapse = saveState, saveSections = saveState, saveSectionOrder = saveState;
  // 離頁前 400ms 還沒送出的最後一個動作補送（作品一覽用 sendBeacon；這個端點要檢查來源網站，改用 keepalive）
  function flushSyncOnLeave(){
    if (!_syncDirty) return;
    clearTimeout(_syncTimer);
    try {
      fetch(SYNC_ENDPOINT, { method: 'POST', headers: {'Content-Type': 'application/json'},
                             body: JSON.stringify({data: buildState()}), keepalive: true });
      _syncDirty = false;
    } catch(e){}
  }
  window.addEventListener('pagehide', flushSyncOnLeave);
  window.addEventListener('beforeunload', flushSyncOnLeave);

  // ── 原始清單：tools.json 之後新增的網址，伺服器版沒有、也沒被刪過 → 自動補進對應分類
  function host(u){ try { var p = new URL(u); return p.host + (p.pathname === '/' ? '' : p.pathname.replace(/\/$/, '')); } catch(e){ return u; } }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function defaults(){
    return { sections: DEFAULTS.map(function(s){ return { id: s.id, icon: s.icon, title: s.title, collapsed: false, items: clone(s.items) }; }),
             removed: [], trash: [] };
  }
  function merge(st){
    var legacy = !Array.isArray(st.trash); // 沒有 trash 欄位＝舊版存檔，刪除只記了網址
    st.trash = Array.isArray(st.trash) ? st.trash.filter(function(t){ return t && t.url; }) : [];
    var known = {};
    (st.removed || []).forEach(function(u){ known[u] = true; });
    st.sections.forEach(function(s){ s.items.forEach(function(i){ known[i.url] = true; }); });
    st.trash.forEach(function(t){ known[t.url] = true; });
    DEFAULTS.forEach(function(d){ d.items.forEach(function(i){
      if (known[i.url]) return;
      var t = st.sections.filter(function(s){ return s.id === d.id; })[0] || st.sections[0];
      t.items.push(clone(i));
    }); });
    // 舊版刪除只記了網址，這裡補成最近刪除裡的項目（名稱取原始清單，原始清單沒有就顯示網址）。
    // 只有舊版存檔才補：新版存檔的 removed 包含永久刪除的網址，補回去會讓永久刪除的項目重新出現
    var live = {}, seen = {}, dead = [];
    st.sections.forEach(function(s){ s.items.forEach(function(i){ live[i.url] = true; }); });
    st.trash.forEach(function(t){ if (!live[t.url] && !seen[t.url]) { seen[t.url] = true; dead.push(t); } });
    (legacy ? (st.removed || []) : []).forEach(function(u){
      if (live[u] || seen[u]) return;
      seen[u] = true;
      var hit = null;
      DEFAULTS.forEach(function(d){ d.items.forEach(function(i){ if (i.url === u) { hit = clone(i); hit.from = d.id; } }); });
      dead.push(hit || { name: host(u), url: u, desc: '', tag: '', from: null });
    });
    st.trash = dead;
    return st;
  }

  // ── 熱門排行：沿用作品一覽的點擊計次，網址前加「mytools::」，次數不跟作品一覽混在一起
  var CLICK_ENDPOINT = 'https://event.bymyway.com/api/coach888/click';
  var CLICK_COUNTS_ENDPOINT = 'https://event.bymyway.com/api/coach888/click-counts';
  var CLICK_PREFIX = 'mytools::';
  var HOT_RANKING_TOP_N = 10;

  function removeFromHotRanking(url){
    return fetch(CLICK_COUNTS_ENDPOINT, {
      method: 'DELETE', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url: CLICK_PREFIX + url})
    });
  }

  function trackClick(url){
    if (!url) return;
    try {
      var blob = new Blob([JSON.stringify({url: CLICK_PREFIX + url})], {type: 'application/json'});
      if (navigator.sendBeacon) navigator.sendBeacon(CLICK_ENDPOINT, blob);
      else fetch(CLICK_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url: CLICK_PREFIX + url}), keepalive:true});
    } catch(e){}
  }

  // 用capture監聽、不call preventDefault/stopPropagation，完全不干擾原本的連結開啟行為
  document.addEventListener('click', function(e){
    var link = e.target.closest('a.name');
    if (!link) return;
    var container = link.closest('[data-url]');
    trackClick(container ? container.dataset.url : link.getAttribute('href'));
  }, true);

  function loadHotRanking(){
    var grid = document.getElementById('hotRankingGrid');
    if (!grid) return;
    fetch(CLICK_COUNTS_ENDPOINT + '?prefix=' + encodeURIComponent(CLICK_PREFIX)).then(function(r){ return r.json(); }).then(function(counts){
      var urlToItem = {};
      document.querySelectorAll('.item[data-url]').forEach(function(it){ urlToItem[it.dataset.url] = it; });
      var entries = Object.keys(counts).map(function(u){ return {url: u.slice(CLICK_PREFIX.length), count: counts[u]}; })
        .filter(function(e){ return e.count > 0 && urlToItem[e.url]; }) // 對應項目已被刪除，不顯示殘影
        .sort(function(a,b){ return b.count - a.count; })
        .slice(0, HOT_RANKING_TOP_N);
      if (!entries.length) return; // 保留HTML原本「還沒有點擊紀錄」的提示文字
      grid.innerHTML = '';
      entries.forEach(function(entry, i){
        var src = urlToItem[entry.url];
        var nameEl = src.querySelector('.name');
        var urlEl = src.querySelector('.url');
        var badgeEl = src.querySelector('.badge');
        var item = document.createElement('div');
        item.className = 'hot-item';
        item.dataset.url = entry.url;
        var rank = document.createElement('div');
        rank.className = 'hot-rank'; rank.textContent = i + 1;
        var a = document.createElement('a');
        a.className = 'name'; a.href = entry.url; a.target = '_blank';
        a.textContent = nameEl ? nameEl.textContent : entry.url;
        var urlDiv = document.createElement('div');
        urlDiv.className = 'url'; urlDiv.textContent = urlEl ? urlEl.textContent : '';
        item.appendChild(rank); item.appendChild(a); item.appendChild(urlDiv);
        if (badgeEl) {
          var badge = document.createElement('div');
          badge.className = badgeEl.className; badge.textContent = badgeEl.textContent;
          item.appendChild(badge);
        }
        var clicks = document.createElement('div');
        clicks.className = 'hot-clicks'; clicks.textContent = '點擊 ' + entry.count + ' 次';
        item.appendChild(clicks);
        var del = document.createElement('span');
        del.className = 'hot-item-del'; del.title = '從熱門排行移除（不影響原分類項目本身）'; del.textContent = '✕';
        del.addEventListener('click', function(ev){
          ev.preventDefault(); ev.stopPropagation();
          removeFromHotRanking(entry.url).then(function(){
            item.remove();
            toast('已從熱門排行移除「' + a.textContent + '」');
          }).catch(function(){ toast('⚠️ 移除失敗，稍後再試'); });
        });
        item.appendChild(del);
        grid.appendChild(item);
      });
    }).catch(function(){});
  }

  function renumber(grid){
    grid.querySelectorAll('.item .num').forEach(function(el, i){ el.textContent = i + 1; });
    var title = grid.previousElementSibling;
    if (title && title.classList.contains('section-title')) {
      var countEl = title.querySelector('.count');
      if (countEl) countEl.textContent = grid.querySelectorAll('.item').length + '項';
    }
  }

  function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  function createSectionBlock(key, name, icon){
    var block = document.createElement('div');
    block.className = 'section-block';
    if (icon) block.dataset.icon = icon;
    block.innerHTML =
      '<div class="section-title" data-section="' + esc(key) + '">' +
        '<span class="toggle-arrow" title="收合/展開">▼</span>' +
        '<span class="section-drag-handle" title="拖曳調整分類順序">⠿</span>' +
        (icon ? '<span class="idx">' + esc(icon) + '</span>' : '') +
        '<span class="title-text" contenteditable="true" spellcheck="false">' + esc(name) + '</span> ' +
        '<span class="count">0項</span>' +
        '<span class="section-del" title="刪除整個分類">🗑</span>' +
      '</div>' +
      '<div class="grid" data-section="' + esc(key) + '"></div>' +
      '<button class="btn-add-item" data-section="' + esc(key) + '">+ 新增項目</button>';
    return block;
  }

  function bindEditable(el, onSave){
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
    el.addEventListener('blur', onSave);
  }

  function wireItem(item){
    var handle = item.querySelector('.drag-handle');
    handle.addEventListener('pointerdown', function(e){
      e.preventDefault();
      dragEl = item;
      sourceGrid = item.closest('.grid');
      item.classList.add('dragging');
      document.addEventListener('pointermove', onMouseMove);
      document.addEventListener('pointerup', onMouseUp);
      document.addEventListener('pointercancel', onMouseUp);
    });
    var del = item.querySelector('.item-del');
    del.addEventListener('click', function(){
      var name = item.querySelector('.name').textContent.trim();
      var grid = item.closest('.grid');
      if (grid.dataset.section === 'recentlydeleted') {
        // 在「最近刪除」裡按刪除＝真的永久刪除，才需要確認
        if (!confirm('確定要永久刪除「' + name + '」嗎？這個動作無法復原。')) return;
        if (removedUrls.indexOf(item.dataset.url) < 0) removedUrls.push(item.dataset.url);
        item.remove();
        renumber(grid);
        saveLayout();
        toast('已永久刪除「' + name + '」');
        return;
      }
      // 一般分類刪除＝移進「最近刪除」，可復原，不用再跳確認視窗
      var recycleGrid = document.querySelector('.grid[data-section="recentlydeleted"]');
      item.dataset.from = grid.dataset.section;
      recycleGrid.appendChild(item);
      renumber(grid);
      renumber(recycleGrid);
      saveLayout();
      toast('已移到「最近刪除」，用☑️批量搬移模式可以勾選移回原分類');
    });
    var badgeEl = item.querySelector('.badge');
    bindEditable(badgeEl, saveBadges);
    ensureBulkCheckbox(item);
    ensureEditIcon(item);
  }

  function ensureBulkCheckbox(item){
    if (item.querySelector('.bulk-checkbox')) return;
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'bulk-checkbox';
    item.querySelector('.drag-handle').insertAdjacentElement('afterend', cb);
    cb.addEventListener('change', function(){
      item.classList.toggle('selected', cb.checked);
      updateBulkBar();
    });
  }

  function ensureEditIcon(item){
    if (item.querySelector('.edit-name')) return;
    var nameEl = item.querySelector('.name');
    var icon = document.createElement('span');
    icon.className = 'edit-name';
    icon.title = '修改顯示名稱';
    icon.textContent = '✏️';
    icon.addEventListener('click', function(e){
      e.preventDefault();
      var current = nameEl.textContent.trim();
      var next = prompt('新的顯示名稱？', current);
      if (next === null || next.trim() === '') return;
      nameEl.textContent = next.trim();
      saveNames();
      toast('已改名為「' + next.trim() + '」，記得按上方複製排序貼給AI固化');
    });
    nameEl.insertAdjacentElement('afterend', icon);
  }

  function createItemElement(url, name, badge, desc){
    var item = document.createElement('div');
    item.className = 'item';
    item.dataset.url = url;
    item.innerHTML = '<span class="drag-handle">⠿</span>' +
      '<div class="num">0</div>' +
      '<a class="name" href="' + esc(url) + '" target="_blank">' + esc(name || url) + '</a>' +
      '<div class="url">' + esc(host(url)) + '</div>' +
      '<div class="badge star" contenteditable="true" spellcheck="false">' + esc(badge || '') + '</div>' +
      '<span class="item-del" title="刪除這個項目">✕</span>';
    if (desc) { item.dataset.desc = desc; item.querySelector('.name').title = desc; }
    return item;
  }

  function addItem(grid){
    var name = prompt('項目名稱？');
    if (name === null || name.trim() === '') return;
    var url = prompt('網址？（例如 https://xxx.bymyway.com/）');
    if (url === null || url.trim() === '') return;
    var badge = prompt('標籤文字？（例如：常用／查詢／工具／策展）', '常用');
    if (badge === null) badge = '';
    name = name.trim(); url = url.trim(); badge = badge.trim();
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url; // 伺服器只收 http(s) 網址，少打了就補上

    var item = createItemElement(url, name, badge);
    grid.appendChild(item);
    wireItem(item);
    renumber(grid);
    saveLayout();
    toast('已新增「' + name + '」，其他裝置重新整理就會同步看到');
  }

  function wireSectionBlock(block){
    var title = block.querySelector('.section-title');
    var grid = block.querySelector('.grid');
    var arrow = title.querySelector('.toggle-arrow');
    arrow.addEventListener('click', function(){
      block.classList.toggle('collapsed');
      saveCollapse();
    });
    var sectionHandle = title.querySelector('.section-drag-handle');
    if (sectionHandle) {
      sectionHandle.addEventListener('pointerdown', function(e){
        e.preventDefault();
        sectionDragEl = block;
        block.classList.add('section-dragging');
        document.addEventListener('pointermove', onSectionMouseMove);
        document.addEventListener('pointerup', onSectionMouseUp);
        document.addEventListener('pointercancel', onSectionMouseUp);
      });
    }
    var delBtn = title.querySelector('.section-del');
    delBtn.addEventListener('click', function(){
      var name = title.querySelector('.title-text').textContent.trim();
      if (!confirm('確定要刪除整個「' + name + '」分類嗎？裡面的項目會先移到「最近刪除」，分類本身會消失。')) return;
      var recycleGrid = document.querySelector('.grid[data-section="recentlydeleted"]');
      var items = Array.prototype.slice.call(grid.querySelectorAll('.item'));
      items.forEach(function(it){ it.dataset.from = grid.dataset.section; recycleGrid.appendChild(it); });
      renumber(recycleGrid);
      block.remove();
      saveLayout();
      saveTitles();
      saveSections();
      if (bulkModeOn) populateBulkSelect();
      toast('已刪除「' + name + '」分類，' + items.length + ' 個項目已移到「最近刪除」');
    });
    var titleText = title.querySelector('.title-text');
    bindEditable(titleText, saveTitles);
    var addBtn = block.querySelector('.btn-add-item');
    addBtn.addEventListener('click', function(){ addItem(grid); });
  }

  function addSection(){
    var name = prompt('新分類的標題？');
    if (name === null || name.trim() === '') return;
    name = name.trim();
    var key = 'custom' + Date.now();

    var block = createSectionBlock(key, name);
    document.querySelector('.wrap').insertBefore(block, document.getElementById('recycleBinBlock'));
    wireSectionBlock(block);
    saveTitles();
    saveSections();
    if (bulkModeOn) populateBulkSelect(); // 新分類要立刻出現在批量搬移下拉選單，不用等重新切換模式
    toast('已新增「' + name + '」分類，接著可以按「+ 新增項目」加內容');
  }

  // 把一份存檔畫成畫面：分類依存檔順序排在「最近刪除」前面
  function renderState(st){
    removedUrls = (st.removed || []).slice();
    var wrap = document.querySelector('.wrap');
    var recycle = document.getElementById('recycleBinBlock');
    document.querySelectorAll('.section-block').forEach(function(b){ if (b.id !== 'recycleBinBlock') b.remove(); });
    st.sections.forEach(function(s){
      var block = createSectionBlock(s.id, s.title || '未命名分類', s.icon);
      if (s.collapsed) block.classList.add('collapsed');
      var grid = block.querySelector('.grid');
      s.items.forEach(function(i){ grid.appendChild(createItemElement(i.url, i.name, i.tag, i.desc)); });
      wrap.insertBefore(block, recycle);
      wireSectionBlock(block);
    });
    var recycleGrid = recycle.querySelector('.grid');
    recycleGrid.innerHTML = '';
    (st.trash || []).forEach(function(t){
      var it = createItemElement(t.url, t.name, t.tag, t.desc);
      if (t.from) it.dataset.from = t.from;
      recycleGrid.appendChild(it);
    });
    recycle.classList.toggle('collapsed', !!st.trashCollapsed);
    document.querySelectorAll('.item').forEach(wireItem);
    document.querySelectorAll('.grid').forEach(renumber);
    if (bulkModeOn) { populateBulkSelect(); updateBulkBar(); }
  }

  function getDragAfterElement(grid, y){
    var els = Array.prototype.slice.call(grid.querySelectorAll('.item:not(.dragging)'));
    return els.reduce(function(closest, child){
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: child };
      }
      return closest;
    }, { offset: -Infinity, element: null }).element;
  }

  // 拖曳跟作品一覽一樣手刻（不用原生 draggable，避免跟連結的原生拖曳打架）；
  // 作品一覽用滑鼠事件，這裡用 pointer 事件，手機手指按住 ⠿ 也能拖
  var dragEl = null;
  var sourceGrid = null;

  function onMouseMove(e){
    if (!dragEl) return;
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var targetGrid = el ? el.closest('.grid') : null;
    if (!targetGrid) return;
    var afterEl = getDragAfterElement(targetGrid, e.clientY);
    if (afterEl == null) {
      targetGrid.appendChild(dragEl);
    } else if (afterEl !== dragEl) {
      targetGrid.insertBefore(dragEl, afterEl);
    }
  }

  function onMouseUp(){
    if (!dragEl) return;
    dragEl.classList.remove('dragging');
    var targetGrid = dragEl.closest('.grid');
    if (targetGrid.dataset.section === 'recentlydeleted' && targetGrid !== sourceGrid) dragEl.dataset.from = sourceGrid.dataset.section;
    renumber(sourceGrid);
    if (targetGrid !== sourceGrid) renumber(targetGrid);
    saveLayout();
    dragEl = null;
    sourceGrid = null;
    document.removeEventListener('pointermove', onMouseMove);
    document.removeEventListener('pointerup', onMouseUp);
    document.removeEventListener('pointercancel', onMouseUp);
  }

  // 大分類本身也能拖曳調整順序：.wrap 是雙欄排版，所以用「游標當下壓在哪一塊」判斷插在前面還是後面
  var sectionDragEl = null;

  function onSectionMouseMove(e){
    if (!sectionDragEl) return;
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var targetBlock = el ? el.closest('.section-block') : null;
    if (!targetBlock || targetBlock === sectionDragEl || targetBlock.id === 'recycleBinBlock') return;
    var wrap = document.querySelector('.wrap');
    var box = targetBlock.getBoundingClientRect();
    var before = e.clientY < box.top + box.height / 2;
    if (before) {
      wrap.insertBefore(sectionDragEl, targetBlock);
    } else {
      wrap.insertBefore(sectionDragEl, targetBlock.nextElementSibling);
    }
  }

  function onSectionMouseUp(){
    if (!sectionDragEl) return;
    sectionDragEl.classList.remove('section-dragging');
    sectionDragEl = null;
    saveSectionOrder();
    document.removeEventListener('pointermove', onSectionMouseMove);
    document.removeEventListener('pointerup', onSectionMouseUp);
    document.removeEventListener('pointercancel', onSectionMouseUp);
  }

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  (function initRecycleBin(){
    var block = document.getElementById('recycleBinBlock');
    var arrow = block.querySelector('.toggle-arrow');
    arrow.addEventListener('click', function(){
      block.classList.toggle('collapsed');
      saveCollapse();
    });
    var emptyBtn = document.getElementById('btnEmptyRecycleBin');
    emptyBtn.addEventListener('click', function(){
      var grid = block.querySelector('.grid');
      var n = grid.querySelectorAll('.item').length;
      if (n === 0) { toast('最近刪除目前是空的'); return; }
      if (!confirm('確定要永久清空「最近刪除」的 ' + n + ' 個項目嗎？這個動作無法復原。')) return;
      grid.querySelectorAll('.item').forEach(function(it){ if (removedUrls.indexOf(it.dataset.url) < 0) removedUrls.push(it.dataset.url); });
      grid.innerHTML = '';
      renumber(grid);
      saveLayout();
      toast('已永久清空最近刪除');
    });
  })();

  document.getElementById('btnAddSection').addEventListener('click', addSection);

  var bulkModeOn = false;

  function updateBulkBar(){
    var checked = document.querySelectorAll('.bulk-checkbox:checked').length;
    document.getElementById('bulkCount').textContent = checked;
    document.getElementById('bulkBar').classList.toggle('show', bulkModeOn);
  }

  function populateBulkSelect(){
    var sel = document.getElementById('bulkTargetSelect');
    sel.innerHTML = '';
    document.querySelectorAll('.section-title').forEach(function(title){
      var opt = document.createElement('option');
      opt.value = title.dataset.section;
      opt.textContent = title.querySelector('.title-text').textContent.trim();
      sel.appendChild(opt);
    });
  }

  document.getElementById('btnBulkMode').addEventListener('click', function(){
    bulkModeOn = !bulkModeOn;
    document.querySelector('.wrap').classList.toggle('bulk-mode', bulkModeOn);
    this.textContent = bulkModeOn ? '✅ 結束批量搬移' : '☑️ 批量搬移模式';
    if (bulkModeOn) {
      populateBulkSelect();
    } else {
      document.querySelectorAll('.bulk-checkbox:checked').forEach(function(cb){ cb.checked = false; });
      document.querySelectorAll('.item.selected').forEach(function(it){ it.classList.remove('selected'); });
    }
    updateBulkBar();
  });

  document.getElementById('btnBulkMove').addEventListener('click', function(){
    var targetSection = document.getElementById('bulkTargetSelect').value;
    var targetGrid = document.querySelector('.grid[data-section="' + targetSection + '"]');
    if (!targetGrid) return;
    var checkedBoxes = Array.prototype.slice.call(document.querySelectorAll('.bulk-checkbox:checked'));
    if (checkedBoxes.length === 0) { toast('請先勾選要搬移的項目'); return; }
    var seenSections = {};
    var sourceGrids = [];
    checkedBoxes.forEach(function(cb){
      var item = cb.closest('.item');
      var srcGrid = item.closest('.grid');
      if (!seenSections[srcGrid.dataset.section]) {
        seenSections[srcGrid.dataset.section] = true;
        sourceGrids.push(srcGrid);
      }
      if (targetSection === 'recentlydeleted' && srcGrid !== targetGrid) item.dataset.from = srcGrid.dataset.section;
      targetGrid.appendChild(item);
      cb.checked = false;
      item.classList.remove('selected');
    });
    sourceGrids.forEach(renumber);
    renumber(targetGrid);
    saveLayout();
    updateBulkBar();
    var targetName = targetGrid.previousElementSibling.querySelector('.title-text').textContent.trim();
    toast('已搬移 ' + checkedBoxes.length + ' 個項目到「' + targetName + '」，記得按上方複製排序貼給AI固化');
  });

  document.getElementById('btnCopy').addEventListener('click', function(){
    var lines = [];
    document.querySelectorAll('.section-title').forEach(function(title, idx){
      var grid = document.querySelectorAll('.grid')[idx];
      lines.push(title.textContent.trim());
      grid.querySelectorAll('.item').forEach(function(item){
        var num = item.querySelector('.num').textContent;
        var name = item.querySelector('.name').textContent;
        var url = item.dataset.url;
        var badge = item.querySelector('.badge').textContent.trim();
        lines.push('  ' + num + '. ' + name + '  ' + url + '  [' + badge + ']');
      });
      lines.push('');
    });
    var text = lines.join('\n');
    navigator.clipboard.writeText(text).then(function(){
      toast('已複製目前排序，貼給小龍蝦即可固化進正式檔案');
    }, function(){
      toast('複製失敗，請手動選取畫面上的文字');
    });
  });

  // 先用這台裝置上次的存檔（沒有就用原始清單）快速畫出畫面，伺服器最新版拉到後再畫一次
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch(e){}
  renderState(merge(cached && cached.sections ? cached : defaults()));
  loadHotRanking();
  fetch(SYNC_ENDPOINT).then(function(r){ return r.json(); }).then(function(j){
    var dirty = null;
    try { dirty = localStorage.getItem(DIRTY_KEY); } catch(e){}
    if (dirty) { syncStateToServer(); return; }
    if (j && j.data && j.data.sections) {
      var st = merge(j.data);
      renderState(st);
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(st)); } catch(e){}
      loadHotRanking(); // 跨裝置排版校正完成、項目都已就位後再抓一次最新點擊排行
    }
  }).catch(function(){});
})();
</script>
</body>
</html>
